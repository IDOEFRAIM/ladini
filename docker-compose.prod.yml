# ═════════════════════════════════════════════════════════════════════
# Ladini — docker-compose.prod.yml   (provider-neutral, 1 node → N nodes)
#
# CE FICHIER NE CONSTRUIT RIEN. Il ne fait que TIRER des images immuables
# depuis un registry (voir §BUILD ONCE). Le build vit dans
# `docker-compose.build.yml` (overlay, utilisé UNIQUEMENT par la CI).
#
# TOPOLOGIE UNIQUE, ressources qui évoluent (chantier Hetzner scale-out,
# 2026-09-16) — voir docs/architecture/deployment-hetzner.md. Ce MÊME
# fichier, ces MÊMES images, tournent aussi bien sur 1 node (< 100
# utilisateurs, aujourd'hui) que sur N nodes derrière un load balancer
# (plusieurs milliers, demain) : le nombre de nodes est un paramètre
# d'infrastructure (infra/providers/hetzner/, infra/inventory.yml), jamais
# un changement de ce fichier ni du code applicatif. Ce que CHAQUE node
# lance dépend de son RÔLE (`--profile app|scheduler|admin`, voir plus bas)
# — jamais "tout sur chaque node".
#
#   Production normale :   docker compose -f docker-compose.prod.yml pull
#                          docker compose -f docker-compose.prod.yml --profile <rôle> up -d
#   (piloté par `scripts/deploy.sh`/`scripts/node_deploy.sh`/
#    `scripts/cluster_deploy.sh` — ne pas lancer à la main)
#
# ── BUILD ONCE / RUN EVERYWHERE ─────────────────────────────────────
# Les 3 images applicatives sont référencées par :
#   ${REGISTRY}/${IMAGE_NAMESPACE}/ladini-<svc>:${RELEASE_VERSION}
# `RELEASE_VERSION` DOIT être un tag immuable et traçable — un SHA de commit
# (`sha-a83f6c1`) ou une release datée (`release-2026.09.10-1`). JAMAIS
# `latest` en production (voir `scripts/preflight.sh`, qui refuse `latest`).
# Le même artefact tourne sur DigitalOcean, Hetzner, OVH, Scaleway, EC2,
# Lightsail ou une VM locale — rien ici n'est spécifique à un fournisseur.
#
# ── DB — Postgres managé EXTERNE, via PgBouncer LOCAL ───────────────
# `pgbouncer` pointe vers le cluster managé (DB_HOST/PORT/USER/PASSWORD/NAME).
# Variables provider-neutral avec repli transitoire sur les anciens `DO_DB_*` :
# `${DB_HOST:-${DO_DB_HOST}}` — les deux conventions marchent, le legacy sera
# retiré plus tard (voir `.env.example` et `docs/runbooks/deployment.md`).
# PgBouncer en mode `transaction` multiplexe toutes les connexions applicatives
# sur un nombre borné de connexions réelles (les plans managés ont un
# `max_connections` bas). `PGBOUNCER_DEFAULT_POOL_SIZE` DOIT rester <=
# (max_connections du plan − marge admin).
#
# ── DIMENSIONNEMENT MULTI-NODE (2026-09-16, chantier Hetzner scale-out §6) ──
# PgBouncer reste LOCAL par node (Node A → PgBouncer A, Node B → PgBouncer B,
# tous vers le MÊME Postgres managé) — jamais un PgBouncer partagé entre nodes
# (single point of failure + latence réseau inter-node inutile). Ce qui
# COMPTE côté Postgres managé est la SOMME sur tous les nodes :
#
#   connexions réelles ouvertes vers Postgres
#     = N_nodes × PGBOUNCER_DEFAULT_POOL_SIZE
#     <= max_connections(plan managé) − marge_admin(ex: 5-10)
#
# Exemple : plan à max_connections=97, marge admin=7 → budget=90.
#   1 node  : PGBOUNCER_DEFAULT_POOL_SIZE peut monter jusqu'à 90.
#   3 nodes : PGBOUNCER_DEFAULT_POOL_SIZE doit rester <= 30 CHACUN (30×3=90).
# En clair : ajouter un node app SANS baisser PGBOUNCER_DEFAULT_POOL_SIZE sur
# TOUS les nodes existants peut saturer `max_connections` du plan managé —
# vérifier ce calcul à CHAQUE changement de `app_node_count`
# (infra/providers/hetzner/variables.tf), avant de déployer.
# `DB_POOL_SIZE`/`DB_POOL_MAX_OVERFLOW` (SQLAlchemy, PAR PROCESS applicatif)
# restent inchangés par le nombre de nodes — PgBouncer absorbe déjà le fan-in
# de plusieurs processus applicatifs vers un nombre borné de connexions
# réelles ; ce sont eux qu'il faut resserrer si le budget ci-dessus est tendu,
# pas `DB_POOL_SIZE`.
#
# ── Le service `mcp` reste à 1 réplique / 1 process ────────────────
# AgriDBMCPServer/runtime sont des singletons process-local (voir
# protocols/mcp/servers/http_server.py). Pour du débit : dupliquer le SERVICE
# (conteneurs `mcp` sur des ports différents + LB), jamais `--scale`/`--workers`.
#
# ── AUTO-HEALING ───────────────────────────────────────────────────
# `docker compose` (hors Swarm) ne redémarre PAS un conteneur `unhealthy` —
# il ne fait que le reporter. `restart: unless-stopped` ne couvre que le crash
# du process. `autoheal` (ci-dessous) surveille l'état Docker natif et
# `docker restart` tout conteneur LABELLISÉ `autoheal=true` marqué `unhealthy`.
# Les healthchecks des conteneurs applicatifs sondent la LIVENESS (`/health`),
# PAS la readiness — un blip DB/Redis ne doit jamais déclencher de restart storm
# (audit hardening 2026-09-10 : `worker` sondait `celery inspect ping`, qui
# dépend du broker → corrigé, voir le service).
#
# ── GRACEFUL SHUTDOWN ──────────────────────────────────────────────
# Chaque `stop_grace_period` est aligné sur le "warm shutdown" du process
# (gunicorn --graceful-timeout, celery warm shutdown, uvicorn). Filet Celery :
# `task_acks_late=True` (celery_app.py) redélivre toute tâche non acquittée.
# ═════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────
# ENVIRONNEMENT DES SERVICES — least-privilege (audit hardening 2026-09-10)
#
# Écrit en LITÉRAL dans chaque service (chaque clé listée directement),
# PAS via un merge YAML `<<:` sur une LISTE d'ancres (`<<: [*a, *b, …]`).
#
# (2026-09-12) Ce fichier utilisait initialement ~9 petites ancres par
# domaine (release/db/redis/mcp/llm/messaging/payments/observability/appsec)
# fusionnées via `<<: [*a, *b, …]` dans `x-full-app-env` et dans les services
# `mcp`/`flower`. Un dev qui lançait `docker compose -f docker-compose.prod.yml
# up` directement sur son poste ne recevait PAS `REDIS_PASSWORD` (ni les
# autres variables) alors que `docker compose config` passait en CI. La
# fusion d'un TABLEAU d'ancres sous une seule clé `<<` est correcte selon la
# spec merge-key YAML, mais son support diffère entre implémentations — celle
# utilisée pour valider ce fichier en CI (PyYAML, `.github/workflows/cicd.yml`)
# n'est PAS celle de Docker Compose (compose-go) : un `config --quiet` qui
# passe en CI ne prouve donc rien sur le comportement à l'exécution réelle.
# Un littéral ne dépend d'AUCUN comportement de fusion — chaque variable est
# directement visible, grep-able, et se comporte à l'identique sur toute
# version de Compose. `settings.py` défaut TOUT champ absent à "" : omettre
# une variable ne casse jamais un service, ça retire une capacité inutilisée
# — c'est ce qui permet à `mcp`/`flower` de ne recevoir qu'un sous-ensemble.
# ─────────────────────────────────────────────────────────────────────

# Env COMPLET — api / worker / beat (ils touchent réellement tous ces domaines :
# release, DB, Redis, MCP, LLM, messagerie, paiements/stockage, observabilité,
# sécurité applicative). `mcp` et `flower` reçoivent un sous-ensemble littéral
# équivalent, voir leurs services plus bas.
x-full-app-env: &full-app-env
  # release-env
  RELEASE_VERSION: "${RELEASE_VERSION:?RELEASE_VERSION requis — un tag immuable, jamais 'latest'}"
  GIT_SHA: "${GIT_SHA:-${RELEASE_VERSION}}"
  BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-unknown}"
  COMPOSE_VERSION: "${COMPOSE_VERSION:-unknown}"
  # db-env
  DATABASE_URL: "postgresql+asyncpg://${DB_USER:-${DO_DB_USER}}:${DB_PASSWORD:-${DO_DB_PASSWORD}}@pgbouncer:6432/${DB_NAME:-${DO_DB_NAME}}"
  DB_SSL_MODE: "disable"
  DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
  DB_POOL_MAX_OVERFLOW: "${DB_POOL_MAX_OVERFLOW:-5}"
  # redis-env — (2026-09-16, chantier Hetzner scale-out) : Redis EXTERNE
  # partagé obligatoire en production, JAMAIS un conteneur local par node
  # (voir docker-compose.dev.yml pour le seul contexte où un Redis local a
  # un sens). `CELERY_BROKER_URL`/`CELERY_RESULT_BACKEND` restent des
  # surcharges OPTIONNELLES (settings.py::celery_broker/celery_backend
  # retombent déjà sur REDIS_URL si absentes) — découplage conceptuel déjà
  # présent côté code, exposé ici au cas où le broker et l'état applicatif
  # devraient un jour vivre sur des clusters Redis distincts ; pointent vers
  # le MÊME Redis par défaut, jamais deux Redis différents par node.
  REDIS_URL: "${REDIS_URL:?REDIS_URL requis — Redis externe partagé (ex: rediss://user:pass@host:port/0), jamais un conteneur local en production. Voir docs/architecture/deployment-hetzner.md §5}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-}"
  # mcp-env
  MCP_DB_TRANSPORT: "http"
  MCP_DB_HTTP_URL: "http://mcp:8003"
  MCP_HTTP_AUTH_TOKEN: "${MCP_HTTP_AUTH_TOKEN:?MCP_HTTP_AUTH_TOKEN requis — le daemon MCP ne doit jamais tourner sans authentification}"
  # llm-env
  LLM_PROVIDER: "groq"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
  LLM_FAST_PRIMARY: "${LLM_FAST_PRIMARY:-bedrock_gateway:qwen.qwen3-32b}"
  LLM_FAST_FALLBACK_1: "${LLM_FAST_FALLBACK_1:-groq:openai/gpt-oss-20b}"
  LLM_FAST_FALLBACK_2: "${LLM_FAST_FALLBACK_2:-}"
  LLM_REASONING_PRIMARY: "${LLM_REASONING_PRIMARY:-bedrock_gateway:deepseek.v3.2}"
  LLM_REASONING_FALLBACK_1: "${LLM_REASONING_FALLBACK_1:-bedrock_gateway:openai.gpt-oss-120b}"
  LLM_REASONING_FALLBACK_2: "${LLM_REASONING_FALLBACK_2:-groq:openai/gpt-oss-120b}"
  LLM_CIRCUIT_FAILURE_THRESHOLD: "${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}"
  LLM_CIRCUIT_COOLDOWN_SECONDS: "${LLM_CIRCUIT_COOLDOWN_SECONDS:-30}"
  LLM_HALF_OPEN_PROBES: "${LLM_HALF_OPEN_PROBES:-1}"
  LLM_PROBE_LOCK_SECONDS: "${LLM_PROBE_LOCK_SECONDS:-10}"
  LLM_FAST_BUDGET_SECONDS: "${LLM_FAST_BUDGET_SECONDS:-12}"
  LLM_REASONING_BUDGET_SECONDS: "${LLM_REASONING_BUDGET_SECONDS:-20}"
  # messaging-env
  MESSAGING_PROVIDER: "${MESSAGING_PROVIDER:-whatsapp_cloud}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
  TWILIO_WHATSAPP_NUMBER: "${TWILIO_WHATSAPP_NUMBER:-}"
  TWILIO_PUBLIC_BASE_URL: "${TWILIO_PUBLIC_BASE_URL:-}"
  TWILIO_INTERACTIVE_ENABLED: "${TWILIO_INTERACTIVE_ENABLED:-false}"
  TWILIO_CONFIRM_CONTENT_SID: "${TWILIO_CONFIRM_CONTENT_SID:-}"
  WHATSAPP_CLOUD_API_TOKEN: "${WHATSAPP_CLOUD_API_TOKEN:-}"
  WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
  WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
  WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
  WHATSAPP_GRAPH_API_VERSION: "${WHATSAPP_GRAPH_API_VERSION:-v21.0}"
  WHATSAPP_NATIVE_INTERACTIVE_ENABLED: "${WHATSAPP_NATIVE_INTERACTIVE_ENABLED:-true}"
  # payments-storage-env
  ESCROW_PAYMENT_ENABLED: "${ESCROW_PAYMENT_ENABLED:-false}"
  PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-}"
  PAYDUNYA_MASTER_KEY: "${PAYDUNYA_MASTER_KEY:-}"
  PAYDUNYA_PRIVATE_KEY: "${PAYDUNYA_PRIVATE_KEY:-}"
  PAYDUNYA_PUBLIC_KEY: "${PAYDUNYA_PUBLIC_KEY:-}"
  PAYDUNYA_TOKEN: "${PAYDUNYA_TOKEN:-}"
  PAYDUNYA_MODE: "${PAYDUNYA_MODE:-test}"
  PAYDUNYA_PAYMENT_TTL_HOURS: "${PAYDUNYA_PAYMENT_TTL_HOURS:-24}"
  SUPABASE_URL: "${SUPABASE_URL:-}"
  SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
  SUPABASE_PRODUCT_BUCKET: "${SUPABASE_PRODUCT_BUCKET:-ladini}"
  # observability-env
  OTEL_ENABLED: "${OTEL_ENABLED:-true}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  PROMETHEUS_ENABLED: "true"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
  LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-true}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
  LANGFUSE_HOST: "https://cloud.langfuse.com"
  # cockpit /admin/monitoring — télémétrie des tours (docs/monitoring/COCKPIT.md)
  AGENT_MONITORING_ENABLED: "${AGENT_MONITORING_ENABLED:-true}"
  AGENT_MONITORING_RETENTION_DAYS: "${AGENT_MONITORING_RETENTION_DAYS:-30}"
  AGENT_MONITORING_SESSION_GAP_MINUTES: "${AGENT_MONITORING_SESSION_GAP_MINUTES:-30}"
  AGENT_MONITORING_WRITE_TIMEOUT_SECONDS: "${AGENT_MONITORING_WRITE_TIMEOUT_SECONDS:-2.0}"
  AGENT_MONITORING_PHONE_PEPPER: "${AGENT_MONITORING_PHONE_PEPPER:-}"
  # appsec-env
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-[]}"
  ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
  INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
  ADMIN_ALERT_WEBHOOK_URL: "${ADMIN_ALERT_WEBHOOK_URL:-}"

# ── Rotation des logs Docker (empêche un petit VPS de se remplir) ────
# 20 Mo × 5 fichiers = 100 Mo max par conteneur. json-file car c'est le driver
# lisible par `docker logs` / `docker compose logs` (un runbook incident en
# dépend). Ajuster `max-size` si un service est très verbeux.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-high-fd-ulimits: &high-fd-ulimits
  nofile: { soft: 65536, hard: 65536 }

# Durcissement — NOS images tournent en non-root (`appuser`), aucune capability
# requise (ports > 1024, aucun mount, aucun changement d'identité).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

# Images TIERCES (redis, pgbouncer) : `no-new-privileges` seulement — leur
# entrypoint démarre root puis bascule via gosu/su-exec (exige CAP_SETUID/SETGID).
x-hardening-thirdparty: &hardening-thirdparty
  security_opt: ["no-new-privileges:true"]

networks:
  agri_net:
    driver: bridge

volumes:
  # État "dernière exécution" de Celery Beat (voir le service `beat`
  # ci-dessous) — local à CE node (beat est un singleton, §9).
  beat_schedule:

services:

  # ── 1. APPLICATIF ──────────────────────────────────────────────────
  # NODE ROLE (2026-09-16, chantier Hetzner scale-out) — un `profiles:` par
  # service reflète le rôle de node auquel il appartient (§9/§19 du chantier) :
  #   app       : mcp, api, worker, pgbouncer — scalable horizontalement,
  #               dupliqué tel quel sur chaque nouveau node.
  #   scheduler : beat — EXACTEMENT un par cluster, jamais par node (voir
  #               infra/inventory.example.yml, validé par
  #               scripts/validate_inventory.py).
  #   admin     : flower — capability d'administration singleton.
  # `autoheal` n'a AUCUN profil (toujours démarré) : chaque type de node
  # veut son propre autoheal local. Sélection au démarrage :
  #   docker compose --profile app -f docker-compose.prod.yml up -d
  #   docker compose --profile scheduler -f docker-compose.prod.yml up -d
  #   docker compose --profile app --profile scheduler --profile admin ... up -d   (phase 1, un seul node)
  mcp:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-idoefraim/ladini}/ladini-mcp:${RELEASE_VERSION:?RELEASE_VERSION requis}"
    profiles: ["app"]
    <<: *hardening
    # least-privilege : le daemon MCP n'exécute que des outils DB. Il ne fait
    # AUCUN appel LLM / WhatsApp / Paydunya / Supabase → ces groupes sont retirés.
    # Littéral (pas de merge `<<:` sur une LISTE d'ancres) — voir la note sur
    # `x-full-app-env` plus haut.
    environment:
      RELEASE_VERSION: "${RELEASE_VERSION:?RELEASE_VERSION requis — un tag immuable, jamais 'latest'}"
      GIT_SHA: "${GIT_SHA:-${RELEASE_VERSION}}"
      BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-unknown}"
      COMPOSE_VERSION: "${COMPOSE_VERSION:-unknown}"
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-${DO_DB_USER}}:${DB_PASSWORD:-${DO_DB_PASSWORD}}@pgbouncer:6432/${DB_NAME:-${DO_DB_NAME}}"
      DB_SSL_MODE: "disable"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_POOL_MAX_OVERFLOW: "${DB_POOL_MAX_OVERFLOW:-5}"
      MCP_DB_TRANSPORT: "http"
      MCP_DB_HTTP_URL: "http://mcp:8003"
      MCP_HTTP_AUTH_TOKEN: "${MCP_HTTP_AUTH_TOKEN:?MCP_HTTP_AUTH_TOKEN requis — le daemon MCP ne doit jamais tourner sans authentification}"
    depends_on:
      pgbouncer: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 35s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }
        reservations: { cpus: "0.25", memory: 384m }
    restart: unless-stopped
    networks: [agri_net]

  api:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-idoefraim/ladini}/ladini-api:${RELEASE_VERSION:?RELEASE_VERSION requis}"
    profiles: ["app"]
    <<: *hardening
    environment: *full-app-env
    # Publié UNIQUEMENT sur la boucle locale : le reverse-proxy (voir
    # infra/reverse-proxy/) termine TLS sur 443 et proxifie vers 127.0.0.1:8000.
    # `"8000:8000"` exposait l'API en clair sur toutes les interfaces (audit
    # hardening 2026-09-10 — §PORTS).
    ports:
      # ${API_HOST_PORT:-8000} : par défaut identique à toujours (8000), le
      # cas normal en production (1 seul node app par hôte). Rend le port
      # hôte surchargeable UNIQUEMENT pour permettre à une stack de
      # validation E2E locale (docker-compose.e2e.yml, projet Compose isolé
      # `-p`) de tourner à côté d'une stack déjà démarrée sur le même poste
      # sans collision de port — jamais utilisé en déploiement réel.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      pgbouncer: { condition: service_healthy }
      mcp: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    sysctls:
      net.core.somaxconn: 1024
    logging: *logging
    # LIVENESS uniquement (`/health` ne teste aucune dépendance externe). La
    # readiness réelle (`/health/ready` : DB + Redis) est vérifiée par
    # `scripts/deploy.sh` APRÈS `up`, pas par autoheal.
    # (2026-09-15, incident réel sur build local `dev-up.sh`) : un démarrage
    # à froid (4 workers gunicorn, imports langgraph/groq lourds à chaque
    # fork) mesuré à ~90-95s de bout en bout — dépassait systématiquement
    # la fenêtre de grâce précédente (30s + 3×15s = 75s), donc autoheal
    # tuait le conteneur à répétition juste avant qu'il finisse de
    # démarrer, en boucle infinie. Relevé à 120s, marge confortable au-delà
    # du pire cas observé.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 40s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536m }
        reservations: { cpus: "0.5", memory: 512m }
    restart: unless-stopped
    networks: [agri_net]

  worker:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-idoefraim/ladini}/ladini-worker:${RELEASE_VERSION:?RELEASE_VERSION requis}"
    profiles: ["app"]
    <<: *hardening
    environment: *full-app-env
    # Concurrence/files : env-driven (§8 du chantier) — reprend EXACTEMENT
    # les options de `infra/docker/Dockerfile.worker` (CMD par défaut de
    # l'image : -Ofair, --pool=prefork, --max-tasks-per-child,
    # --max-memory-per-child, dont les justifications détaillées vivent dans
    # ce Dockerfile, pas dupliquées ici), en rendant concurrence/files
    # SURCHARGEABLES sans reconstruire l'image — augmenter la capacité
    # worker devient un changement de variable, jamais de code/image.
    command: ["celery", "-A", "ladini.api.celery_app", "worker",
             "--loglevel=info", "-Ofair", "--pool=prefork",
             "--concurrency=${CELERY_WORKER_CONCURRENCY:-4}",
             "--prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}",
             "--max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}",
             "--max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-450000}",
             "-Q", "${CELERY_WORKER_QUEUES:-interactive,background,scheduled,celery}"]
    depends_on:
      pgbouncer: { condition: service_healthy }
      mcp: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    logging: *logging
    # LIVENESS : "un process celery vit-il dans ce conteneur ?" — SANS toucher
    # au broker. `celery inspect ping` (ancienne sonde) échoue dès que Redis
    # a un hoquet → autoheal redémarrait tous les workers en boucle pendant une
    # panne Redis, aggravant l'incident (audit hardening 2026-09-10).
    #
    # (2026-09-18, incident réel sha-891cb2f) — `pgrep` SEUL rapportait
    # "healthy" pendant que le worker crash-loopait réellement (ValueError
    # TLS Redis au boot, voir api/celery_app.py §BUG CORRIGÉ ICI) : un
    # crash-loop rapide laisse, à chaque cycle, une brève fenêtre où un
    # process "celery...worker" existe (le temps de crasher), suffisante pour
    # qu'un `pgrep` échantillonné toutes les 30s l'attrape "vivant" sans qu'il
    # ait jamais fini de démarrer. Fix : exige EN PLUS le marqueur écrit par
    # `celery.signals.worker_ready` (api/celery_app.py) — ne se déclenche
    # qu'APRÈS une connexion broker+backend réussie, jamais pendant un crash
    # au boot. Toujours zéro round-trip broker sur CHAQUE probe (juste
    # `test -f`) — même coût et même insensibilité à un hoquet Redis
    # transitoire que `pgrep` seul, mais ne peut plus mentir sur un
    # crash-loop au démarrage.
    healthcheck:
      # Chemin en dur (PAS `${CELERY_WORKER_READY_FILE:-...}`) : Compose
      # interpole `${...}` dans `test:` au moment de `config`/`up` — CÔTÉ
      # HÔTE, pas dans le shell du conteneur au moment de la probe — un
      # override de CELERY_WORKER_READY_FILE dans `environment:` ci-dessus
      # n'aurait donc AUCUN effet ici (confirmé via `docker compose config`).
      # Le défaut Python (api/celery_app.py) est le même chemin ; les deux
      # DOIVENT rester synchronisés si l'un change un jour.
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' >/dev/null && test -f /tmp/celery_worker_ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 90s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "3.0", memory: 2560m }
        reservations: { cpus: "0.75", memory: 1024m }
    restart: unless-stopped
    networks: [agri_net]

  beat:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-idoefraim/ladini}/ladini-worker:${RELEASE_VERSION:?RELEASE_VERSION requis}"
    profiles: ["scheduler"]
    <<: *hardening
    command: ["celery", "-A", "ladini.api.celery_app", "beat",
             "--loglevel=info", "--pidfile=/tmp/celerybeat.pid",
             "--schedule=/var/lib/celery-beat/celerybeat-schedule"]
    environment: *full-app-env
    # (2026-09-16) volume nommé plutôt que `/tmp` : sans lui, un redémarrage
    # (déploiement, OOM, node swap) perdait l'état "dernière exécution" de
    # chaque tâche planifiée — bénin pour la plupart des crons (au pire un
    # cycle sauté/redoublé), mais inutile de le perdre pour rien vu le coût
    # nul d'un volume. Reste SUR CE NODE : beat est un singleton (§9), il ne
    # migre pas d'un node à l'autre en cours de route.
    volumes:
      - beat_schedule:/var/lib/celery-beat
    logging: *logging
    # (2026-09-15, incident réel) : `--pidfile` n'écrivait jamais
    # `/tmp/celerybeat.pid` dans ce conteneur (procédé confirmé bien vivant —
    # `ps aux` le montrait actif — mais le fichier restait absent, sans
    # aucune exception journalisée), donc `test -f ...` échouait
    # systématiquement -> unhealthy -> autoheal redémarrait en boucle un
    # scheduler qui tournait pourtant normalement. Même correctif déjà
    # appliqué à `worker` ci-dessus (le check dépendait du broker) : sonder
    # la LIVENESS du PROCESSUS directement, jamais un fichier intermédiaire
    # fragile.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { cpus: "0.1", memory: 128m }
    restart: unless-stopped
    networks: [agri_net]

  # (2026-09-16, chantier Hetzner scale-out §5/§20) : le service `redis`
  # LOCAL a été RETIRÉ d'ici — production pointe désormais vers un Redis
  # EXTERNE partagé obligatoire (REDIS_URL, tout en haut de ce fichier).
  # Un Redis local par node empêcherait le vrai multi-node (Node A → Redis A,
  # Node B → Redis B pour les mêmes fonctions métier — idempotence, verrous,
  # broker Celery — cassant silencieusement la cohérence dès 2 nodes). Le
  # service Redis local (config identique, y compris `noeviction`/AOF) vit
  # maintenant dans `docker-compose.dev.yml`, profil DEV/TEST uniquement.

  pgbouncer:
    profiles: ["app"]
    # Pin exact (audit hardening 2026-09-10) : `:latest` sur un composant qui
    # tient TOUTES les connexions DB de la stack = roulette russe au redéploiement.
    image: edoburu/pgbouncer:v1.23.1-p2
    <<: *hardening-thirdparty
    environment:
      LISTEN_PORT: "6432"
      DB_HOST: "${DB_HOST:-${DO_DB_HOST}}"
      DB_PORT: "${DB_PORT:-${DO_DB_PORT:-25060}}"
      DB_USER: "${DB_USER:-${DO_DB_USER}}"
      DB_PASSWORD: "${DB_PASSWORD:-${DO_DB_PASSWORD}}"
      DB_NAME: "${DB_NAME:-${DO_DB_NAME}}"
      SERVER_TLS_SSLMODE: "require"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-20}"
      AUTH_TYPE: scram-sha-256
      # (2026-09-17, follow-up pre-Hetzner) — fail-fast sur backend mort.
      # Trouvé en E2E local : sans réglage explicite, PgBouncer tourne avec
      # ses défauts (server_connect_timeout=15s — correct pour une NOUVELLE
      # connexion — mais AUCUN TCP keepalive par défaut), donc une connexion
      # déjà établie vers un backend qui disparaît BRUTALEMENT (crash, pas de
      # FIN/RST propre — coupure réseau, primaire managé qui bascule) reste
      # "vivante" du point de vue du noyau jusqu'à un timeout de
      # retransmission TCP par défaut du système — mesuré en direct : PREMIÈRE
      # requête après la mort de Postgres bloquée ~11 MINUTES avant que
      # PgBouncer ne détecte la connexion morte. Sans TCP keepalive, rien ne
      # peut fondamentalement détecter ça plus tôt qu'au niveau applicatif.
      SERVER_CONNECT_TIMEOUT: "5"
      SERVER_LOGIN_RETRY: "5"
      # Un client webhook synchrone ne doit jamais attendre plus de quelques
      # secondes une connexion serveur en file — au-delà, mieux vaut un échec
      # net (503 côté /health/ready) qu'une requête qui traîne.
      QUERY_WAIT_TIMEOUT: "20"
      # Recycle les connexions serveur inactives plus tôt (défaut 600s) —
      # réduit la fenêtre pendant laquelle une connexion pourrait devenir
      # silencieusement obsolète avant même d'être réutilisée.
      SERVER_IDLE_TIMEOUT: "60"
      # Le vrai correctif : keepalive TCP actif entre PgBouncer et le
      # Postgres managé — détecte un pair mort en ~15s (5 + 3×3) au lieu de
      # dépendre du timeout de retransmission par défaut du noyau (bien plus
      # long, observé ~11min en pratique sur cet environnement).
      TCP_KEEPALIVE: "1"
      TCP_KEEPIDLE: "5"
      TCP_KEEPINTVL: "3"
      TCP_KEEPCNT: "3"
    ulimits: *high-fd-ulimits
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
        reservations: { cpus: "0.1", memory: 64m }
    restart: unless-stopped
    networks: [agri_net]

  flower:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-idoefraim/ladini}/ladini-api:${RELEASE_VERSION:?RELEASE_VERSION requis}"
    profiles: ["admin"]
    <<: *hardening
    command: ["celery", "-A", "ladini.api.celery_app", "flower",
             "--port=5555",
             "--basic_auth=${FLOWER_USER:?FLOWER_USER requis}:${FLOWER_PASSWORD:?FLOWER_PASSWORD requis}"]
    # least-privilege : Flower n'a besoin QUE du broker Redis + de son auth.
    # Il ne fait aucun appel LLM/messaging/DB → ces groupes sont retirés
    # (audit hardening 2026-09-10 : il recevait tout `*app-env`, dont les
    # clés Groq / Twilio / WhatsApp / Paydunya, sans jamais s'en servir).
    # Littéral (pas de merge `<<:` sur une LISTE d'ancres) — voir la note sur
    # `x-full-app-env` plus haut.
    environment:
      RELEASE_VERSION: "${RELEASE_VERSION:?RELEASE_VERSION requis — un tag immuable, jamais 'latest'}"
      GIT_SHA: "${GIT_SHA:-${RELEASE_VERSION}}"
      BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-unknown}"
      COMPOSE_VERSION: "${COMPOSE_VERSION:-unknown}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL requis — Redis externe partagé, voir la note sur x-full-app-env plus haut}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-}"
    ports:
      # Boucle locale uniquement — accès par tunnel SSH :
      #   ssh -L 5555:127.0.0.1:5555 user@hote
      # ${FLOWER_HOST_PORT:-5555} : même rationale que API_HOST_PORT ci-dessus
      # (service api) — surchargeable uniquement pour la validation E2E locale.
      - "127.0.0.1:${FLOWER_HOST_PORT:-5555}:5555"
    # Override du HEALTHCHECK natif de l'image ladini-api (`curl .../health`
    # sur :8000) : Flower ne lance pas l'app FastAPI et n'écoute pas sur 8000,
    # il écoute sur :5555 avec basic auth — le healthcheck hérité échouait
    # donc systématiquement (conteneur marqué unhealthy en boucle, restarts
    # autoheal). On vérifie ici que Flower répond réellement (200 ou 401 =
    # serveur up, l'auth n'est pas le sujet du healthcheck).
    # `start_period` (2026-09-14, incident réel `dev-up` : conteneur marqué
    # "unhealthy" avant même d'avoir fini de démarrer, faisant échouer le
    # script alors que Flower finissait par répondre correctement quelques
    # secondes plus tard). Flower partage l'image `ladini-api` et exécute donc
    # le MÊME warmup au démarrage que `api`/`worker` (scan du registre
    # d'outils MCP, `[ToolScopeWarmup]` dans les logs) avant de pouvoir
    # servir la moindre requête HTTP sur :5555 — mesuré en local à ~110s au
    # premier succès, largement au-delà des 30s hérités de `api`/`mcp` (qui,
    # eux, n'ont pas ce warmup avant leur endpoint /health). `worker`
    # ci-dessus a déjà un `start_period` plus long (40s) pour la même raison
    # de nature (démarrage plus lourd que les endpoints HTTP simples) ; 90s
    # donne à Flower une marge réelle plutôt que hérité par erreur de
    # copier-coller d'`api`/`mcp`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:5555/ | grep -qE '^(200|401)$' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { cpus: "0.05", memory: 128m }
    restart: unless-stopped
    networks: [agri_net]

  autoheal:
    # Pin exact (audit hardening 2026-09-10) : ce conteneur monte le socket
    # Docker (privilège quasi-root sur l'hôte) — `:latest` dessus est inacceptable.
    image: willfarrell/autoheal:1.2.0
    environment:
      # N'agit QUE sur les conteneurs explicitement labellisés (pas "toute la
      # stack") — le label est déjà posé service par service ci-dessus.
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "30"
    volumes:
      # :ro — autoheal n'a besoin QUE de lire l'état et d'émettre un restart ;
      # le socket en lecture seule suffit à `docker restart` via l'API tout en
      # réduisant la surface (pas de `build`, `exec`, `cp`… exploitables).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 64m }
    restart: unless-stopped
    # PAS sur `agri_net` (audit hardening 2026-09-10) : autoheal parle au démon
    # Docker via le socket, jamais au réseau applicatif — l'y laisser lui
    # donnait une visibilité réseau inutile sur redis/pgbouncer/mcp.
