# ═════════════════════════════════════════════════════════════════════
# AgriConnect — docker-compose.prod.yml
#
# Deux blocs sur le MÊME réseau `agri_net` :
#   1. APPLICATIF : api (FastAPI), worker (Celery), redis (broker),
#      postgres (DB), pgbouncer (pooling), flower (monitoring Celery).
#   2. LANGFUSE v3 (LLMOps self-hosted) : langfuse-web, langfuse-worker,
#      clickhouse, minio, langfuse-postgres.
#
# ⚠️  IMPORTANT — Langfuse v3 : contrairement à v2 (postgres seul), le
#     self-host v3 EXIGE ClickHouse + un stockage S3 (MinIO) + Redis. Le bloc
#     ci-dessous en donne la structure ; RÉCONCILIEZ les tags d'image et la
#     liste exacte des variables d'env avec le docker-compose officiel du repo
#     `langfuse/langfuse` avant mise en prod (les clés de chiffrement/salt
#     évoluent entre versions). Ne PAS déployer avec les secrets par défaut.
#
# Ressources : `deploy.resources.limits` est honoré par `docker compose up`
# (Compose v2). `reservations` est best-effort. Ajustez selon votre hôte.
# ═════════════════════════════════════════════════════════════════════

x-app-env: &app-env
  # DB passe par PgBouncer (pool partagé, protège la DB de la saturation par
  # les N workers). asyncpg + PgBouncer transaction-mode : OK ici car le repo
  # désactive déjà le statement cache asyncpg (core/database.py).
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}"
  DB_SSL_MODE: "disable"              # réseau interne Docker → pas de SSL
  REDIS_URL: "redis://redis:6379/0"
  # LLM
  LLM_PROVIDER: "groq"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  # Twilio
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  TWILIO_WHATSAPP_NUMBER: "${TWILIO_WHATSAPP_NUMBER}"
  TWILIO_INTERACTIVE_ENABLED: "${TWILIO_INTERACTIVE_ENABLED:-false}"
  TWILIO_CONFIRM_CONTENT_SID: "${TWILIO_CONFIRM_CONTENT_SID:-}"
  # Observabilité infra
  OTEL_ENABLED: "${OTEL_ENABLED:-true}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  PROMETHEUS_ENABLED: "true"
  # LLMOps (Langfuse)
  LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-true}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
  LANGFUSE_HOST: "http://langfuse-web:3000"

networks:
  agri_net:
    driver: bridge

volumes:
  pg_data:
  langfuse_pg_data:
  clickhouse_data:
  minio_data:

services:
  # ── 1. APPLICATIF ──────────────────────────────────────────────────
  api:
    image: agriconnect-api:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
        reservations: { cpus: "0.25", memory: 384m }
    restart: unless-stopped
    networks: [agri_net]

  worker:
    image: agriconnect-worker:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        API_IMAGE: agriconnect-api:latest
    environment: *app-env
    depends_on:
      api: { condition: service_started }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A agriconnect.api.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
        reservations: { cpus: "0.5", memory: 512m }
    restart: unless-stopped
    networks: [agri_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640m }
    restart: unless-stopped
    networks: [agri_net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    restart: unless-stopped
    networks: [agri_net]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: "${POSTGRES_DB}"
      # Transaction pooling : le meilleur ratio pour N workers courts. Compatible
      # avec asyncpg ICI car le repo force statement_cache_size=0.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    restart: unless-stopped
    networks: [agri_net]

  flower:
    image: agriconnect-api:latest   # même image (flower est dans pyproject)
    command: ["celery", "-A", "agriconnect.api.celery_app", "flower",
              "--port=5555", "--basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}"]
    environment: *app-env
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
    restart: unless-stopped
    networks: [agri_net]

  # ── 2. LANGFUSE v3 (LLMOps self-hosted) ────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_DB_NAME}"
      NEXTAUTH_URL: "${LANGFUSE_PUBLIC_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"   # hex 64 (openssl rand -hex 32)
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
      REDIS_CONNECTION_STRING: "redis://redis:6379/1"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "${MINIO_BUCKET}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/public/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [agri_net]

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_DB_NAME}"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
      REDIS_CONNECTION_STRING: "redis://redis:6379/1"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "${MINIO_BUCKET}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    restart: unless-stopped
    networks: [agri_net]

  langfuse-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${LANGFUSE_DB_USER}"
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD}"
      POSTGRES_DB: "${LANGFUSE_DB_NAME}"
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER} -d ${LANGFUSE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [agri_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [agri_net]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [agri_net]
