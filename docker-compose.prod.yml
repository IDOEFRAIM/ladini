# ═════════════════════════════════════════════════════════════════════
# Ladini — docker-compose.prod.yml
#
# Deux blocs sur le MÊME réseau `agri_net` :
#   1. APPLICATIF : api (FastAPI), worker (Celery), mcp (daemon HTTP
#      AgriDBMCPServer — transport persistant, pool DB chaud, voir
#      protocols/mcp/servers/http_server.py), redis (broker), pgbouncer
#      (pooler vers la DB EXTERNE DigitalOcean — voir bandeau DB
#      ci-dessous), flower (monitoring Celery), autoheal (auto-restart
#      des conteneurs `unhealthy`, voir bandeau HEALTHCHECKS ci-dessous).
#   2. LANGFUSE v3 (LLMOps self-hosted) : langfuse-web, langfuse-worker,
#      clickhouse, minio, langfuse-postgres.
#
# ⚠️  DB — Postgres managé EXTERNE, via PgBouncer LOCAL :
#     `pgbouncer` ne pointe PAS vers un Postgres local (il n'y en a plus
#     dans ce fichier) mais vers le cluster managé désigné par
#     DO_DB_HOST/PORT/USER/… (voir x-app-env et le service `pgbouncer`).
#     Ces variables sont nommées `DO_DB_*` pour raison historique
#     (provider d'origine : DigitalOcean) mais portent, depuis la migration
#     du 2026-09-02, les identifiants Heroku Postgres — voir le `.env` à la
#     racine du host de déploiement (PAS versionné, absent de ce checkout).
#     Objectif du pooler : les plans managés (DO comme Heroku) imposent un
#     `max_connections` bas ; sans pooler, chaque process applicatif qui
#     ouvre son propre pool SQLAlchemy (4 workers gunicorn × api-replicas +
#     concurrency×worker-replicas + mcp) peut dépasser ce plafond dès qu'on
#     scale — PgBouncer en mode `transaction` multiplexe TOUTES ces
#     connexions applicatives sur un nombre borné de connexions réelles vers
#     le cluster managé. Voir DEFAULT_POOL_SIZE dans le service `pgbouncer` :
#     DOIT être aligné sur le `max_connections` réel de votre plan
#     (dashboard Heroku Postgres → Settings).
#
# ⚠️  Le service `mcp` DOIT rester à 1 seule réplique/process (voir la
#     docstring de http_server.py) : AgriDBMCPServer/runtime sont des
#     singletons process-local. Pour plus de débit, dupliquer le SERVICE
#     (plusieurs conteneurs `mcp` sur des ports différents + load
#     balancer), jamais via plusieurs workers/replicas du même service.
#
# ⚠️  HEALTHCHECKS & AUTO-HEALING : `docker compose` (hors Swarm) ne
#     redémarre JAMAIS un conteneur automatiquement sur un healthcheck qui
#     passe à `unhealthy` — c'est un malentendu fréquent. Le statut
#     `unhealthy` est seulement REPORTÉ (`docker ps`, `depends_on:
#     condition: service_healthy` d'un autre service), rien ne le corrige
#     seul. `restart: unless-stopped` ne couvre que le cas où le PROCESS
#     quitte (crash, exit code non-zero) — pas le cas où un healthcheck
#     échoue alors que le process tourne encore (deadlock applicatif, DB
#     injoignable, etc.). D'où `autoheal` ci-dessous : il surveille l'état
#     Docker natif et `docker restart` tout conteneur marqué `unhealthy` —
#     seule façon d'obtenir un vrai auto-healing SANS migrer vers Swarm/K8s.
#
# ⚠️  GRACEFUL SHUTDOWN : chaque service a un `stop_grace_period` aligné
#     sur le délai de "warm shutdown" de son process (gunicorn
#     --graceful-timeout, celery warm shutdown, uvicorn
#     --timeout-graceful-shutdown — voir les Dockerfiles). Si Docker
#     envoie SIGKILL AVANT que le process ait fini de drainer (délai par
#     défaut = 10s, bien trop court pour une tâche LLM en cours), une
#     requête/tâche en vol est perdue brutalement au lieu d'être terminée
#     proprement. Pour Celery, le vrai filet de sécurité reste
#     `task_acks_late=True` (celery_app.py) : même si le SIGKILL arrive
#     quand même, la tâche non-acquittée est redélivrée à un autre worker —
#     `stop_grace_period` MINIMISE les interruptions forcées, il ne les
#     élimine pas totalement (une tâche peut légitimement dépasser le
#     délai).
#
# ⚠️  IMPORTANT — Langfuse v3 : contrairement à v2 (postgres seul), le
#     self-host v3 EXIGE ClickHouse + un stockage S3 (MinIO) + Redis. Le bloc
#     ci-dessous en donne la structure ; RÉCONCILIEZ les tags d'image et la
#     liste exacte des variables d'env avec le docker-compose officiel du repo
#     `langfuse/langfuse` avant mise en prod (les clés de chiffrement/salt
#     évoluent entre versions). Ne PAS déployer avec les secrets par défaut.
#
# Ressources : `deploy.resources.limits` EST honoré par `docker compose up`
# (impose un plafond cgroup dur → OOM-killer si dépassé — c'est le VRAI
# levier anti-OOM-aléatoire). `reservations` reste best-effort hors Swarm
# (surtout indicatif/documentaire ici). Les valeurs ci-dessous supposent un
# hôte ~8 vCPU / 16 Go RAM — RECALCULEZ pour votre hôte réel (voir le detail
# du calcul en commentaire sur chaque service).
# ═════════════════════════════════════════════════════════════════════
# ═════════════════════════════════════════════════════════════════════
# Ladini — docker-compose.prod.yml (Version Allégée / MVP < 100 users)
# Langfuse externalisé sur le Cloud — DB Postgres/PgBouncer conservée
# ═════════════════════════════════════════════════════════════════════

x-app-env: &app-env
  DATABASE_URL: "postgresql+asyncpg://${DO_DB_USER}:${DO_DB_PASSWORD}@pgbouncer:6432/${DO_DB_NAME}"
  DB_SSL_MODE: "disable"
  DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
  DB_POOL_MAX_OVERFLOW: "${DB_POOL_MAX_OVERFLOW:-5}"
  REDIS_URL: "redis://redis:6379/0"
  
  # MCP
  MCP_DB_TRANSPORT: "http"
  MCP_DB_HTTP_URL: "http://mcp:8003"
  
  # LLM
  LLM_PROVIDER: "groq"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  # Passerelle Bedrock compatible OpenAI — requis par tout candidat
  # `bedrock_gateway:...` du LLM Gateway (voir bloc ci-dessous). Absents ici
  # jusqu'au 2026-09-02 : `LLM_PROVIDER` étant figé à "groq" ci-dessus, la
  # passerelle Bedrock n'était encore jamais utilisée par la stack Docker.
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
  # LLM Gateway (2026-09-02) — chaîne de repli par profil FAST/REASONING,
  # disjoncteur partagé (Redis), budget par profil, alerting admin. Voir
  # `.env.example` pour le détail de chaque variable et
  # `graphs/agents/market_coach/llm_gateway/`.
  LLM_FAST_PRIMARY: "${LLM_FAST_PRIMARY:-bedrock_gateway:qwen.qwen3-32b}"
  LLM_FAST_FALLBACK_1: "${LLM_FAST_FALLBACK_1:-groq:llama-3.1-8b-instant}"
  LLM_FAST_FALLBACK_2: "${LLM_FAST_FALLBACK_2:-}"
  LLM_REASONING_PRIMARY: "${LLM_REASONING_PRIMARY:-bedrock_gateway:deepseek.v3.2}"
  LLM_REASONING_FALLBACK_1: "${LLM_REASONING_FALLBACK_1:-bedrock_gateway:openai.gpt-oss-120b}"
  LLM_REASONING_FALLBACK_2: "${LLM_REASONING_FALLBACK_2:-groq:llama-3.3-70b-versatile}"
  LLM_CIRCUIT_FAILURE_THRESHOLD: "${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}"
  LLM_CIRCUIT_COOLDOWN_SECONDS: "${LLM_CIRCUIT_COOLDOWN_SECONDS:-30}"
  LLM_HALF_OPEN_PROBES: "${LLM_HALF_OPEN_PROBES:-1}"
  LLM_PROBE_LOCK_SECONDS: "${LLM_PROBE_LOCK_SECONDS:-10}"
  LLM_FAST_BUDGET_SECONDS: "${LLM_FAST_BUDGET_SECONDS:-12}"
  LLM_REASONING_BUDGET_SECONDS: "${LLM_REASONING_BUDGET_SECONDS:-20}"
  ADMIN_ALERT_WEBHOOK_URL: "${ADMIN_ALERT_WEBHOOK_URL:-}"
  ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"

  # Messaging (WhatsApp / Twilio)
  MESSAGING_PROVIDER: "${MESSAGING_PROVIDER:-whatsapp_cloud}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  TWILIO_WHATSAPP_NUMBER: "${TWILIO_WHATSAPP_NUMBER}"
  TWILIO_INTERACTIVE_ENABLED: "${TWILIO_INTERACTIVE_ENABLED:-false}"
  TWILIO_CONFIRM_CONTENT_SID: "${TWILIO_CONFIRM_CONTENT_SID:-}"
  WHATSAPP_CLOUD_API_TOKEN: "${WHATSAPP_CLOUD_API_TOKEN:-}"
  WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
  WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
  WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
  WHATSAPP_GRAPH_API_VERSION: "${WHATSAPP_GRAPH_API_VERSION:-v21.0}"
  WHATSAPP_NATIVE_INTERACTIVE_ENABLED: "${WHATSAPP_NATIVE_INTERACTIVE_ENABLED:-true}"
  
  # Observabilité infra
  OTEL_ENABLED: "${OTEL_ENABLED:-true}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  PROMETHEUS_ENABLED: "true"
  
  # LLMOps — Basculé sur Langfuse Cloud (plus de stack locale lourde)
  LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-true}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
  LANGFUSE_HOST: "https://cloud.langfuse.com"

x-high-fd-ulimits: &high-fd-ulimits
  nofile:
    soft: 65536
    hard: 65536

networks:
  agri_net:
    driver: bridge

volumes:
  # Seuls les volumes indispensables persistent si besoin, 
  # les volumes Langfuse (ClickHouse, MinIO, etc.) ont été purgés.
  {}

services:

  # ── 1. APPLICATIF ──────────────────────────────────────────────────
  mcp:
    image: ladini-mcp:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mcp
      args:
        API_IMAGE: ladini-api:latest
    environment: *app-env
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 35s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }
        reservations: { cpus: "0.25", memory: 384m }
    restart: unless-stopped
    networks: [agri_net]

  api:
    image: ladini-api:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    sysctls:
      net.core.somaxconn: 1024
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 40s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536m }
        reservations: { cpus: "0.5", memory: 512m }
    restart: unless-stopped
    networks: [agri_net]

  worker:
    image: ladini-worker:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        API_IMAGE: ladini-api:latest
    environment: *app-env
    depends_on:
      api: { condition: service_started }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp: { condition: service_healthy }
    ulimits: *high-fd-ulimits
    healthcheck:
      test: ["CMD-SHELL", "celery -A agriconnect.api.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 90s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "3.0", memory: 2560m }
        reservations: { cpus: "0.75", memory: 1024m }
    restart: unless-stopped
    networks: [agri_net]

  beat:
    image: ladini-worker:latest
    command: ["celery", "-A", "agriconnect.api.celery_app", "beat",
             "--loglevel=info", "--pidfile=/tmp/celerybeat.pid",
             "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { cpus: "0.1", memory: 128m }
    restart: unless-stopped
    networks: [agri_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ulimits: *high-fd-ulimits
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640m }
        reservations: { cpus: "0.1", memory: 256m }
    restart: unless-stopped
    networks: [agri_net]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      LISTEN_PORT: "6432"
      DB_HOST: "${DO_DB_HOST}"
      DB_PORT: "${DO_DB_PORT:-25060}"
      DB_USER: "${DO_DB_USER}"
      DB_PASSWORD: "${DO_DB_PASSWORD}"
      DB_NAME: "${DO_DB_NAME}"
      SERVER_TLS_SSLMODE: "require"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-20}"
      AUTH_TYPE: scram-sha-256
    ulimits: *high-fd-ulimits
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    labels: ["autoheal=true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
        reservations: { cpus: "0.1", memory: 64m }
    restart: unless-stopped
    networks: [agri_net]

  flower:
    image: ladini-api:latest
    command: ["celery", "-A", "agriconnect.api.celery_app", "flower",
             "--port=5555", "--basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}"]
    environment: *app-env
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
        reservations: { cpus: "0.05", memory: 128m }
    restart: unless-stopped
    networks: [agri_net]

  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 64m }
    restart: unless-stopped
    networks: [agri_net]