  - id: lefaso_actualites
    engine: news_article
    priority: 4
    frequency: 1d
    tags: [news, burkina, actualites, politique, economie]
    config:
      url: https://lefaso.net/
      preferred_selectors:
        - article
        - main
        - "#content"
        - ".post-content"
        - ".entry-content"
      site_patterns:
        lefaso.net:
          article: [article, main, .entry-content, .post-content]
          title: [h1, .entry-title, title]

