  - id: fao_technical_resources
    engine: technical_crawler
    priority: 3
    frequency: weekly
    tags: [technical, fao, agriculture, ressources]
    config:
      url: https://www.fao.org/faostat/fr/#data
      start_url: https://www.fao.org/faostat/fr/#data
      max_depth: 1
      max_pages: 8
      max_memory_limit: 15728640
      preferred_selectors:
        - main
        - article
        - "#content"
        - ".post-content"
        - ".entry-content"

