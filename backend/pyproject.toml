[tool.poetry]
name = "agriconnect-backend"
version = "1.0.0"
description = "Event-Driven Modular Monolith - Agriculture AI Assistant"
authors = ["IDOEFRAIM <idoefraimtanka@gmail.com>"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "agriconnect", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.1"
tqdm = "^4.66"
pydantic = "^2.0"
httpx = "^0.28"
shapely = "^2.0"
pillow = "^10.0"
loguru = "^0.7"
aiofiles = "^23.1"
pytest = "^7.0"
# Additional dependencies requested for Agri-OS

# --- Web Framework ---
fastapi = "^0.117"
uvicorn = {extras = ["standard"], version = "^0.38"}
python-multipart = ">=0.0.18"
aiohttp = "^3.9"

# --- Event-Driven (Celery + Redis) ---
celery = {extras = ["redis"], version = "^5.4"}
redis = "^5.0"
flower = "^2.0"  # Monitoring Celery

# --- Database ---
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"  # PostgreSQL async driver
psycopg2-binary = "^2.9"
alembic = "^1.13"  # Migrations
pgvector = "^0.3"  # Vector extension
prisma = "^0.11"

# --- AI/ML ---
torch = "^2.2"

# --- LangGraph / LangChain (marketplace runtime) ---
langgraph = ">=0.2"
langchain = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.2"
langchain-groq = "^0.2"
scikit-learn = "^1.5"

# --- Azure Services ---
azure-cognitiveservices-speech = "^1.40"
azure-storage-blob = "^12.23"
azure-identity = "^1.19"
boto3 = "^1.34"

# --- WhatsApp (Twilio) ---
twilio = "^9.3"

# --- Monitoring & Observability ---
structlog = "^24.4"
prometheus-client = "^0.21"
langsmith = ">=0.1.0"
sentry-sdk = "^1.39"
python-json-logger = "^2.0"
# --- Observabilité prod (OpenTelemetry infra + Langfuse LLMOps) ---
# Optionnelles à l'exécution : core/telemetry.py les lazy-importe et devient
# no-op si absentes. Déclarées ici pour reproductibilité (poetry install).
langfuse = ">=2.53,<3"
opentelemetry-sdk = "^1.27"
opentelemetry-exporter-otlp-proto-grpc = "^1.27"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-celery = "^0.48b0"

# --- Environment & Config ---
python-dotenv = "^1.0"
pydantic-settings = "^2.6"

# --- Utils ---
requests = "^2.32.5"
pyyaml = "^6.0"
tenacity = "^9.0"
ftfy = "^6.2"
apscheduler = "^3.11.2"
groq = ">=0.30.0,<1.0.0"
rapidfuzz = "^3.9"
# >=0.1 laissait passer 2.1.2 (installé en pratique), qui n'a ni
# fastmcp.client.elicitation ni fastmcp.client.transports.StreamableHttpTransport
# — requis par infrastructure/mcp/client.py depuis l'audit MCP/AGUI 2026-08-27
# (transport HTTP réel, StreamableHttpTransport). 3.1.0 est la version
# vérifiée de bout en bout (stdio + http + Twilio réel) dans cet audit.
fastmcp = "^3.1"
earthengine-api = "^1.7.10"
# removed: psycopg2 source build (use psycopg2-binary)
pandas = "^2.1"
geopy = "^2.4"
pytest-asyncio = "^0.21"
gunicorn = "^21.2"
openai = "^1.54"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.3,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

# ==========================================
# Configuration Ruff
# ==========================================
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E: Syntax/pycodestyle, F: Pyflakes (variables non définies), I: Import sorting, B: Bugbear (pièges Python)
select = ["E", "F", "I", "B"]
ignore = ["E501"] # Ignore la longueur de ligne stricte si formatée par ailleurs

[tool.ruff.lint.isort]
known-first-party = ["src", "agriconnect"]

# ==========================================
# Configuration Mypy
# ==========================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
