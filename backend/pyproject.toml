[tool.poetry]
name = "ladini-backend"
version = "1.0.0"
description = "Event-Driven Modular Monolith - Agriculture AI Assistant"
authors = ["IDOEFRAIM <idoefraimtanka@gmail.com>"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "ladini", from = "src" }
]

# ─────────────────────────────────────────────────────────────────────
# Dépendances RUNTIME de `ladini` (le seul paquet livré).
#
# Purge legacy 2026-09-11 (phase déploiement) : 29 paquets déclarés mais
# JAMAIS importés par `src/ladini` ni par `tests/` ont été retirés — vérifié
# par `deptry src` + grep exhaustif des imports top-level. Gains : ~2 Go
# (torch), scipy/numpy/pandas (scikit-learn), 3 libs de logging redondantes
# (structlog/loguru/python-json-logger — le code utilise `logging` stdlib via
# core/logger.py), le mauvais ORM (prisma — on est en SQLAlchemy), la couche
# LangChain haute (langchain/-community/-openai/-groq — le runtime agent
# utilise langgraph + langchain-core + les SDK bruts groq/openai), Azure
# Speech/Blob (Supabase est le stockage, USE_AZURE_SPEECH=False),
# earthengine-api (Lambda séparée avec son propre requirements.txt), etc.
# Détail complet : docs/DEPENDENCY_AUDIT_2026-09-11.md
# ─────────────────────────────────────────────────────────────────────
[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.0"
pydantic-settings = "^2.6"
python-dotenv = "^1.0"

# --- Web / ASGI ---
fastapi = "^0.117"
uvicorn = {extras = ["standard"], version = "^0.38"}
starlette = "^0.40"          # importé directement par protocols/mcp/servers/http_server.py
python-multipart = ">=0.0.18" # requis par FastAPI pour parser Form(...) (twilio_webhook.py)
gunicorn = "^21.2"           # CMD de infra/docker/Dockerfile.api

# --- Event-driven : Celery + Redis ---
celery = {extras = ["redis"], version = "^5.4"}
redis = "^5.0"
flower = "^2.0"              # exécuté par le service `flower` du compose

# --- Base de données ---
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"            # driver Postgres async (le seul utilisé)
alembic = "^1.13"            # outil de migration appelé par scripts/deploy.sh

# --- Agent : LangGraph + MCP ---
langgraph = ">=0.2"
langchain-core = "^0.3"     # importé directement par workspace/checkpointer.py
mcp = ">=1.0"                # importé directement par protocols/mcp/servers/*.py
# Épinglé 3.1.x : 3.1.0 est la version vérifiée de bout en bout (stdio + http
# + Twilio réel, audit MCP/AGUI 2026-08-27). fastmcp 3.4 a retiré/déplacé
# `Context` (importé par infrastructure/mcp/context.py) → `^3.1` cassait
# l'import. Rester sur la minor testée jusqu'à validation explicite d'une
# montée de version.
fastmcp = ">=3.1,<3.2"

# --- LLM (SDK bruts, pas la couche LangChain) ---
groq = ">=0.30.0,<1.0.0"
openai = "^1.54"            # protocole OpenAI-compat (Groq + passerelle Bedrock)
boto3 = "^1.34"            # Bedrock natif (Converse) — import paresseux dans core/get_llm.py

# --- Messagerie ---
twilio = "^9.3"

# --- Utils réellement utilisés ---
httpx = "^0.28"
rapidfuzz = "^3.9"          # matching flou (core/slots.py, buyer search)
typing-extensions = "^4.12" # importé directement par graphs/.../core/state.py & flows/*/state.py

# --- Observabilité (imports paresseux dans core/telemetry.py — no-op si absent,
#     déclarés pour la reproductibilité `poetry install`) ---
prometheus-client = "^0.21"
sentry-sdk = "^2.0"        # utilisé par core/logger.py::_init_sentry_if_needed (v1 -> v2)
langfuse = ">=2.53,<3"
opentelemetry-sdk = "^1.27"
opentelemetry-exporter-otlp-proto-grpc = "^1.27"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-celery = "^0.48b0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────────────────────────────
# Dépendances DEV / CI uniquement — jamais dans l'image de production
# (`poetry install --only main` dans infra/docker/Dockerfile.api).
# ─────────────────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21"
pytest-cov = "^7.1"
ruff = "^0.16.3"
mypy = "^1.11"
deptry = "^0.20"           # audit des dépendances (CI + local)
pyyaml = "^6.0"            # utilisé seulement par tests/evals/runners/

# ==========================================
# Configuration Ruff
# ==========================================
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E: Syntax/pycodestyle, F: Pyflakes (variables non définies), I: Import sorting, B: Bugbear (pièges Python)
select = ["E", "F", "I", "B"]
ignore = ["E501"] # Ignore la longueur de ligne stricte si formatée par ailleurs

[tool.ruff.lint.isort]
known-first-party = ["src", "ladini"]

# ==========================================
# Configuration Mypy
# ==========================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

# ==========================================
# Configuration deptry (audit dépendances)
# ==========================================
[tool.deptry]
known_first_party = ["ladini"]

[tool.deptry.per_rule_ignores]
# DEP002 = "déclaré mais pas importé" — ces 4 sont utilisés au RUNTIME
# (CLI / plugin), pas par un `import`, donc deptry ne peut pas les voir :
#   gunicorn         -> CMD de infra/docker/Dockerfile.api
#   flower           -> service `flower` du compose (celery … flower)
#   alembic          -> scripts/deploy.sh (alembic upgrade head)
#   python-multipart -> requis par FastAPI pour parser Form(...) (twilio_webhook.py)
DEP002 = ["gunicorn", "flower", "alembic", "python-multipart"]
# DEP003 = "importé mais transitif" — botocore vient de boto3, importé pour
# ses types d'exception dans core/get_llm.py.
DEP003 = ["botocore"]
