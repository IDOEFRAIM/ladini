[pytest]
# `rootdir`=backend : les tests importent `ladini` via tests/conftest.py
# (qui ajoute src/ au sys.path) — pas besoin d'installation editable.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `tests` doit être importable en tant que paquet (les fixtures partagées sont
# importées explicitement : `from tests.conftest import ...`).
pythonpath = . src

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    slow: test long (exclu par `-m "not slow"`)
    integration: parcours de bout en bout
    architecture: invariants structurels (anti-dérive)

filterwarnings =
    ignore::DeprecationWarning
