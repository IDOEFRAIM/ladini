scenario_id: P1-CART-005
version: "1.1"
priority: P1
domain: buyer_preorder
tags: [multi_step_transaction, gps_delivery_gate, preorder_state_machine]
grounding:
  status: PROVEN_BY_CODE
  evidence:
    - "backend/src/ladini/graphs/agents/market_coach/flows/buyer/preorder.py:100-406 — 3-phase state machine CART -> PREORDER_DRAFTED -> CONFIRMED, GPS gate mandatory between draft and confirm"
    - "backend/src/ladini/services/mcp/gateway.py:296-325 — create_preorder_draft / confirm_preorder_draft literal tool names"
    - "backend/src/ladini/graphs/agents/market_coach/flows/buyer/cart.py:280-330 — cart adds are local state, no MCP tool"
  correction_note: >
    Original Wave 1 version asserted tool_calls: [add_to_cart, add_to_cart,
    init_preorder, confirm_preorder] — three of four names do not exist, and
    the mandatory GPS-gate turn was omitted entirely. Fully rewritten below.

persona: {role: BUYER, description: "Acheteur, commande multi-produits", phone: "+22670000024"}
workspace_type: buyer
initial_state: {}

conversation:
  - turn: 1
    user_message: "Ajoute 20kg d'oignons à mon panier"
    expected_behavior:
      tool_calls: {calls: [search_products], ordered: false}
      state_assertion: {workspace: self, active_cart: [{product: "oignons", quantity: 20, unit: "KG"}]}
  - turn: 2
    user_message: "Ajoute aussi 10kg de piment"
    expected_behavior:
      tool_calls: {calls: [search_products], ordered: false}
      state_assertion:
        workspace: self
        active_cart:
          - {product: "oignons", quantity: 20, unit: "KG"}
          - {product: "piment", quantity: 10, unit: "KG"}
  - turn: 3
    user_message: "Je valide mon panier"
    expected_behavior:
      intent: BUYER_PREORDER_INIT
      tool_calls: {calls: [create_preorder_draft], ordered: false}
      state_assertion: {workspace: self, preorder_workflow.phase: "PREORDER_DRAFTED"}
      response_claims: ["response asks the user to confirm the preorder (oui/non)"]
  - turn: 4
    user_message: "Oui"
    channel_event: CONFIRM
    expected_behavior:
      # First CONFIRM at PREORDER_DRAFTED + not gps_stage -> enters GPS stage, no write yet
      tool_calls: {calls: [], ordered: false}
      response_claims: ["response asks for a delivery location/GPS point"]
      state_assertion: {workspace: self, preorder_workflow.gps_stage: true}
  - turn: 5
    user_message: "Livraison à mon adresse habituelle"
    channel_event: CONFIRM
    expected_behavior:
      tool_calls: {calls: [confirm_preorder_draft], ordered: false}
      state_assertion: {workspace: self, preorder_workflow.phase: "CONFIRMED", active_cart: []}
      response_claims: ["response confirms the order only if confirm_preorder_draft succeeded"]

must_not_execute: []
security_expectations: {gate: null, attack_class: null, attack_vector: null}
expected_final_outcome: {end_to_end_success: true, phase_transitions: ["CART", "PREORDER_DRAFTED", "CONFIRMED"]}
metric_applicability: [trajectory_flow_correctness, tool_selection_recall, end_to_end_task_success, state_mutation_correctness]
runner_requirement: "sequential replay (5 turns)"
