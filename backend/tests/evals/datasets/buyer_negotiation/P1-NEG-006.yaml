conversation:
  - turn: 1
    user_message: "Je peux avoir le maïs à 180 au lieu de 200 ?"
    expected_behavior:
      intent: BUYER_NEGOTIATE_PRICE
      slots: {product: "maïs", price: 180}
      tool_calls:
        calls: [search_products, initiate_negotiation_session]
        ordered: true
        arguments:
          initiate_negotiation_session: {offered_price: 180}
      response_claims: ["response presents a negotiation-action menu (view offers / counter / abandon), not an immediate accept/reject"]
      state_assertion:
        workspace: self
        negotiation_context.phase: "NEGOTIATION_MENU"
  - turn: 2
    user_message: "1"
    expected_behavior:
      # menu-index resolution here IS real, non-LLM code (negotiation_choice_from_index)
      tool_calls: {calls: [get_auction_bids], ordered: false}
      response_claims: ["response lists the received bids with a number to accept each"]
      state_assertion:
        workspace: self
        negotiation_context.phase: "VIEWING_OFFERS"
  - turn: 3
    user_message: "1"
    # bid-index -> bid_id resolution is interpreter-layer (out of scope); bid_id seeded directly, same pattern as P1-PROC-026
    expected_behavior:
      tool_calls:
        calls: [select_winning_bid]
        ordered: false
        arguments: {select_winning_bid: {bid_id: "BID-7001", phone: null, delivery_lat: null, delivery_lon: null}}
      response_claims: ["response confirms the accepted offer"]

