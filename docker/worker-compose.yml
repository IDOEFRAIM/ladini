version: '3.8'

services:
  ingestion_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agriconnect/ingestion-worker:local
    command: python -m backend.ingestion.worker --run
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=REDACTED_AWS_SECRET_ACCESS_KEY
    volumes:
      - ./:/app:rw
    restart: always
