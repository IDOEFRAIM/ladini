# ═════════════════════════════════════════════════════════════════════
# analytics_ops.yml — opérations Buyer Analytics ponctuelles, avec
# approbation humaine (même environnement GitHub `production`/`staging`
# que deploy.yml, même runner self-hosted déjà présent SUR l'hôte : aucun
# SSH entrant depuis un runner GitHub-hosted, exactement comme deploy.yml).
#
# Chaque action lance `python -m ladini.services.analytics.ops_cli <cmd>`
# DANS le conteneur `worker` déjà déployé (même image/env que le code de
# prod, jamais de SQL manuel depuis ce workflow) et n'imprime que le JSON
# résumé retourné par la CLI (compteurs, jamais de secret ni de ligne
# métier). `verify_public_route` ne touche à rien : il prouve depuis
# l'extérieur que `/internal/analytics/*` est bien fail-closed (sans/avec
# mauvais jeton -> refus, jamais 404) en lisant le VRAI jeton déployé dans
# le `.env` applicatif du node (jamais dupliqué dans un secret séparé),
# sans jamais l'imprimer.
# ═════════════════════════════════════════════════════════════════════
name: Analytics ops (manual approval)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Opération à exécuter"
        required: true
        type: choice
        options: [verify_public_route, recompute, drift, backfill, quality, verify_kpis, debug_caddy, debug_repo, force_recreate_caddy]
      target:
        description: "Cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      lookback_days:
        description: "recompute uniquement : fenêtre glissante en jours"
        required: false
        default: "14"

concurrency:
  group: analytics-ops-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ github.event.inputs.action }} → ${{ github.event.inputs.target }}
    runs-on: [self-hosted, linux, x64, production]
    environment: ${{ github.event.inputs.target }}
    steps:
      - name: Exécuter l'opération sur ladini-app-1
        shell: bash
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          ACTION: ${{ github.event.inputs.action }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          set -Eeuo pipefail

          [ -n "${DEPLOY_DIR:-}" ] || { echo "FATAL: DEPLOY_DIR absent"; exit 1; }
          [ -d "$DEPLOY_DIR/.git" ] || { echo "FATAL: $DEPLOY_DIR n'est pas un checkout Git"; exit 1; }
          cd "$DEPLOY_DIR"

          COMPOSE_FILE="$DEPLOY_DIR/docker-compose.prod.yml"
          ENV_FILE="$DEPLOY_DIR/.env"
          [ -f "$ENV_FILE" ] || { echo "FATAL: $ENV_FILE absent — aucune release applicative déployée ici"; exit 1; }
          dc() { docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"; }

          run_cli() {
            dc exec -T worker python -m ladini.services.analytics.ops_cli "$@"
          }

          case "$ACTION" in
            recompute)
              run_cli recompute --lookback-days "${LOOKBACK_DAYS:-14}"
              ;;
            drift)
              run_cli drift
              ;;
            backfill)
              run_cli backfill
              ;;
            quality)
              run_cli quality
              ;;
            verify_kpis)
              run_cli verify-kpis
              ;;
            verify_public_route)
              # Lit le jeton RÉELLEMENT déployé (celui que FastAPI valide) — jamais
              # un secret GitHub séparé qui pourrait diverger. `set +x` explicite :
              # cette valeur ne doit jamais apparaître dans les logs, même en debug.
              set +x
              TOKEN="$(grep -E '^INTERNAL_API_TOKEN=' "$ENV_FILE" | head -n1 | cut -d= -f2-)"
              DOMAIN="$(grep -E '^PUBLIC_DOMAIN=' "$DEPLOY_DIR/infra/reverse-proxy/.env" | head -n1 | cut -d= -f2-)"
              [ -n "$TOKEN" ] || { echo "FATAL: INTERNAL_API_TOKEN absent du .env déployé"; exit 1; }
              [ -n "$DOMAIN" ] || { echo "FATAL: PUBLIC_DOMAIN absent du .env du reverse proxy"; exit 1; }
              URL="https://${DOMAIN}/internal/analytics/buyers/health"

              no_token=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$URL")
              wrong_token=$(curl -s -o /dev/null -m 15 -w '%{http_code}' -H "X-Internal-Token: not-the-token" "$URL")
              good_token=$(curl -s -o /dev/null -m 15 -w '%{http_code}' -H "X-Internal-Token: ${TOKEN}" "$URL")
              unset TOKEN

              echo "{\"action\":\"verify_public_route\",\"url\":\"${URL}\",\"no_token_status\":${no_token},\"wrong_token_status\":${wrong_token},\"good_token_status\":${good_token}}"

              [ "$no_token" != "404" ] || { echo "::error::route toujours 404 — Caddy ne proxifie pas /internal/analytics/*"; exit 1; }
              [ "$no_token" = "401" ] || [ "$no_token" = "503" ] || { echo "::error::sans jeton attendu 401/503, reçu $no_token"; exit 1; }
              [ "$wrong_token" = "401" ] || [ "$wrong_token" = "503" ] || { echo "::error::mauvais jeton attendu 401/503, reçu $wrong_token"; exit 1; }
              [ "$good_token" = "200" ] || { echo "::error::bon jeton attendu 200, reçu $good_token — token Vercel/backend potentiellement désynchronisé"; exit 1; }
              echo "✓ /internal/analytics/* : fail-closed confirmé, bon jeton -> 200"
              ;;
            force_recreate_caddy)
              # Recovery ponctuelle (2026-09-27) : le Caddyfile sur disque a déjà la
              # nouvelle route (confirmé par debug_repo) mais le conteneur, démarré
              # avant, garde un bind-mount épinglé sur l'ancien inode (voir
              # node_deploy.sh, même commentaire). Recrée SEULEMENT `caddy`,
              # rien d'autre — image et .env inchangés, aucune autre route touchée.
              (cd "$DEPLOY_DIR/infra/reverse-proxy" && docker compose --env-file .env up -d --force-recreate caddy)
              CADDY_ID="$(cd "$DEPLOY_DIR/infra/reverse-proxy" && docker compose --env-file .env ps -q caddy)"
              for _i in $(seq 1 60); do
                st="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CADDY_ID" 2>/dev/null || true)"
                [ "$st" = "healthy" ] && break
                sleep 1
              done
              echo "caddy status: ${st:-unknown}"
              [ "$st" = "healthy" ] || { echo "::error::caddy non healthy après recréation"; exit 1; }
              echo "── vérification : la nouvelle route apparaît dans le fichier monté ──"
              docker exec "$CADDY_ID" grep -n "analytics_internal" /etc/caddy/Caddyfile
              ;;
            debug_repo)
              echo "── DEPLOY_DIR == /opt/ladini/app ? ──"
              [ "$DEPLOY_DIR" = "/opt/ladini/app" ] && echo yes || echo "no (differs)"
              echo "── HEAD du checkout à DEPLOY_DIR ──"
              git -C "$DEPLOY_DIR" rev-parse HEAD
              git -C "$DEPLOY_DIR" log -1 --oneline
              echo "── état du fichier Caddyfile suivi par git à ce HEAD ──"
              git -C "$DEPLOY_DIR" status --porcelain -- infra/reverse-proxy/Caddyfile || true
              git -C "$DEPLOY_DIR" diff --stat HEAD -- infra/reverse-proxy/Caddyfile || true
              echo "── contenu tel qu'il devrait être au HEAD courant (git show) ──"
              git -C "$DEPLOY_DIR" show HEAD:infra/reverse-proxy/Caddyfile | grep -n "analytics_internal" || echo "(absent du HEAD indexé)"
              echo "── contenu réellement sur disque (host) ──"
              grep -n "analytics_internal" "$DEPLOY_DIR/infra/reverse-proxy/Caddyfile" || echo "(absent du fichier sur disque)"
              md5sum "$DEPLOY_DIR/infra/reverse-proxy/Caddyfile"
              stat -c '%y %n' "$DEPLOY_DIR/infra/reverse-proxy/Caddyfile"
              echo "── autres checkouts /opt/ladini* éventuels ──"
              find /opt -maxdepth 3 -iname "Caddyfile" 2>/dev/null
              ;;
            debug_caddy)
              # Diagnostic temporaire (2026-09-27, mise en service /internal/analytics/*) :
              # aucune donnée sensible — juste le Caddyfile réellement chargé par le
              # conteneur en cours d'exécution et son état admin, pour comprendre
              # pourquoi la route reste 404 malgré un reload sans erreur.
              CADDY_ID="$(cd "$DEPLOY_DIR/infra/reverse-proxy" && docker compose --env-file .env ps -q caddy)"
              [ -n "$CADDY_ID" ] || { echo "FATAL: conteneur caddy introuvable"; exit 1; }
              echo "── Caddyfile chargé dans le conteneur ($CADDY_ID) ──"
              docker exec "$CADDY_ID" cat /etc/caddy/Caddyfile
              echo "── docker compose ps (reverse-proxy) ──"
              (cd "$DEPLOY_DIR/infra/reverse-proxy" && docker compose --env-file .env ps)
              echo "── config active via l'API admin Caddy ──"
              docker exec "$CADDY_ID" wget -qO- http://127.0.0.1:2019/config/ || true
              echo
              echo "── test loopback direct (contourne DNS/Cloudflare) ──"
              docker exec "$CADDY_ID" wget -qS -O /dev/null --header="Host: $(grep -E '^PUBLIC_DOMAIN=' "$DEPLOY_DIR/infra/reverse-proxy/.env" | cut -d= -f2-)" http://127.0.0.1/internal/analytics/buyers/health 2>&1 || true
              ;;
            *)
              echo "FATAL: action inconnue: $ACTION"
              exit 1
              ;;
          esac
