# ═════════════════════════════════════════════════════════════════════
# deploy.yml — DÉPLOIEMENT EXPLICITE, avec approbation humaine.
#
# Jamais déclenché automatiquement. Un opérateur lance `workflow_dispatch`
# avec la `release` cible (un tag `sha-*` produit par release.yml). L'étape
# de déploiement est protégée par l'ENVIRONNEMENT GitHub `production`
# SSH ne parte.
#
# La logique de release vit ENTIÈREMENT côté VPS — ce workflow ne fait que :
# (1) valider que l'image existe, (2) SSH vers UN host (le "control node" —
# le node-a de l'inventaire en phase 1, ou un bastion dédié en phase 2),
# (3) lancer le bon script. Aucune dépendance à `doctl`/`aws`/`hcloud` :
# provider-neutral.
#
# (2026-09-16, chantier Hetzner scale-out) : PHASE 1 (1 node) et PHASE 2
# (N nodes) utilisent EXACTEMENT ce même workflow — la seule différence est
# la PRÉSENCE de `infra/inventory.yml` sur le control node. S'il existe :
# `scripts/cluster_deploy.sh` (rolling, migrations une seule fois, respecte
# le rôle scheduler singleton — voir infra/inventory.example.yml). Sinon :
# le comportement HISTORIQUE inchangé (`scripts/deploy.sh`, single-VPS).
# Aucun nouvel input de workflow requis — la bascule est automatique et sans
# risque de régression pour un opérateur qui n'a pas encore créé
# d'inventaire (le cas de TOUT déploiement existant avant ce chantier).
# ═════════════════════════════════════════════════════════════════════
name: Deploy (manual approval)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release à déployer (ex: sha-a83f6c1). DOIT exister au registry."
        required: true
      target:
        description: "Cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Un seul déploiement à la fois PAR cible. Un second dispatch attend
  # (le VPS a en plus son propre verrou flock — double sécurité, §36).
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'idoefraim/ladini' }}

jobs:
  verify-image:
    name: Vérifier que la release existe au registry
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker manifest inspect (les 3 images)
        run: |
          set -euo pipefail
          for svc in api worker mcp; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/ladini-${svc}:${{ github.event.inputs.release }}"
            echo "→ $ref"
            docker manifest inspect "$ref" >/dev/null \
              || { echo "::error::Image absente du registry : $ref"; exit 1; }
          done
          echo "Les 3 images existent."

  deploy:
    name: Deploy → ${{ github.event.inputs.target }}
    needs: verify-image

    # Le déploiement production s'exécute directement sur ladini-app-1.
    # Aucun SSH entrant depuis un runner GitHub-hosted n'est nécessaire.
    runs-on: [self-hosted, linux, x64, production]

    environment: ${{ github.event.inputs.target }}

    steps:
      - name: Deploy on ladini-app-1
        shell: bash
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          LADINI_APP_ENV_B64: ${{ secrets.LADINI_APP_ENV_B64 }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          set -Eeuo pipefail

          [ -n "${DEPLOY_DIR:-}" ] || {
            echo "FATAL: DEPLOY_DIR absent"
            exit 1
          }

          [ -d "$DEPLOY_DIR/.git" ] || {
            echo "FATAL: $DEPLOY_DIR n'est pas un checkout Git"
            exit 1
          }

          [ -n "${LADINI_APP_ENV_B64:-}" ] || {
            echo "FATAL: secret LADINI_APP_ENV_B64 absent"
            exit 1
          }

          [ -n "${PUBLIC_DOMAIN:-}" ] || {
            echo "FATAL: variable PUBLIC_DOMAIN absente"
            exit 1
          }

          [ -n "${ACME_EMAIL:-}" ] || {
            echo "FATAL: variable ACME_EMAIL absente"
            exit 1
          }

          cd "$DEPLOY_DIR"
          umask 077

          # ── Configuration applicative ──────────────────────────────
          APP_ENV_TMP="$DEPLOY_DIR/.env.new.$$"

          if ! printf '%s' "$LADINI_APP_ENV_B64" | base64 -d > "$APP_ENV_TMP"; then
            rm -f "$APP_ENV_TMP"
            echo "FATAL: décodage de LADINI_APP_ENV_B64 impossible"
            exit 1
          fi

          [ -s "$APP_ENV_TMP" ] || {
            rm -f "$APP_ENV_TMP"
            echo "FATAL: .env applicatif décodé vide"
            exit 1
          }

          chmod 600 "$APP_ENV_TMP"
          mv -f "$APP_ENV_TMP" "$DEPLOY_DIR/.env"
          echo "→ .env applicatif installé"

          # ── Configuration Caddy ────────────────────────────────────
          PROXY_DIR="$DEPLOY_DIR/infra/reverse-proxy"

          [ -d "$PROXY_DIR" ] || {
            echo "FATAL: $PROXY_DIR absent"
            exit 1
          }

          PROXY_ENV_TMP="$PROXY_DIR/.env.new.$$"

          printf 'PUBLIC_DOMAIN=%s\nACME_EMAIL=%s\n' \
            "$PUBLIC_DOMAIN" \
            "$ACME_EMAIL" \
            > "$PROXY_ENV_TMP"

          chmod 600 "$PROXY_ENV_TMP"
          mv -f "$PROXY_ENV_TMP" "$PROXY_DIR/.env"
          echo "→ .env Caddy installé"

          # ── Synchronisation du code de déploiement ─────────────────
          echo "→ synchronisation du dépôt privé"
          git fetch --tags --quiet origin

          # Fail-closed : contrairement à l'ancien workflow, aucune
          # erreur de checkout n'est ignorée.
          git checkout --quiet "${{ github.sha }}" -- \
            scripts/ \
            docker-compose.prod.yml \
            docker-compose.dev.yml \
            infra/

          # ── Déploiement ────────────────────────────────────────────
          if [ -f infra/inventory.yml ]; then
            echo "→ inventaire présent : déploiement multi-node"
            ./scripts/cluster_deploy.sh "${{ github.event.inputs.release }}"
          else
            echo "→ pas d'inventaire : déploiement single-node"
            ./scripts/deploy.sh "${{ github.event.inputs.release }}"
          fi
