# GitHub Actions CI — Lint & Tests
#
# Portée volontairement réduite : monolith Poetry sous `backend/` (`agriconnect`),
# déployé via `docker-compose.prod.yml` + `deploy-prod.sh` sur hôte Docker.
#
# Le déploiement reste manuel/SSH via `deploy-prod.sh` — rien ici ne pousse en prod.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          # Utilisation de poetry.lock pour figer le cache de manière déterministe
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        # Réinstalle l'environnement exact défini dans pyproject.toml / poetry.lock
        run: poetry install --no-root

      - name: Run linter (Ruff)
        # Exécute ruff à travers poetry (si configuré dans pyproject.toml)
        run: poetry run ruff check src
        continue-on-error: true

      - name: Run type checker (mypy)
        # Exécute mypy à travers poetry (lit la section [tool.mypy] de pyproject.toml)
        run: poetry run mypy src
        continue-on-error: true

      - name: Run tests
        run: poetry run pytest tests --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false