# ═════════════════════════════════════════════════════════════════════
# CI — bloque une PR/branche cassée AVANT le merge. NE DÉPLOIE RIEN et
# NE POUSSE RIEN au registry (voir release.yml pour le build-once, deploy.yml
# pour le déploiement à approbation humaine).
# ═════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Une PR qui pousse 3 commits d'affilée : seul le dernier run survit.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Code Quality
    runs-on: ubuntu-latest
    # PostgreSQL éphémère pour `backend/tests/schema/` : chaque session de test y CRÉE une base
    # vide, rejoue les migrations Drizzle (backend/schema_contract/) et compare Drizzle / SQLAlchemy
    # / PostgreSQL. REQUIRE_SCHEMA_DB=1 : sans base, le test ÉCHOUE (jamais de skip silencieux en CI).
    env:
      HAS_FRONTEND_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN != '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        # Épinglé à la version qui a généré backend/poetry.lock (2026-09-11) —
        # `poetry check --lock` peut se plaindre d'un lock "désynchronisé"
        # entre deux versions majeures/mineures de Poetry qui sérialisent le
        # lock différemment. Élimine cette variable.
        run: pipx install poetry==2.2.1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        # défaut = main + groupe `dev` (ruff, mypy, pytest*, deptry).
        # L'image de prod, elle, fait `poetry install --only main`.
        run: poetry install --no-root

      - name: Vérifier la cohérence pyproject / poetry.lock
        run: poetry check --lock

      - name: Audit des dépendances (deptry — unused / missing / misplaced)
        # Bloquant : on veut zéro dépendance déclarée-mais-inutilisée (purge
        # 2026-09-11). Voir docs/DEPENDENCY_AUDIT_2026-09-11.md.
        run: poetry run deptry src

      - name: Run linter (Ruff)
        run: poetry run ruff check src

      - name: Run type checker (mypy)
        run: poetry run mypy src
        continue-on-error: true

      - name: Contrat de schéma — copie backend == dépôt frontend (Drizzle = source de vérité)
        # Nécessite le secret FRONTEND_REPO_TOKEN (lecture du dépôt frontend, privé). Sans lui, ce
        # contrôle de synchronisation est ignoré ; les tests de cohérence, eux, tournent toujours
        # sur la copie versionnée (backend/schema_contract/).
        if: ${{ env.HAS_FRONTEND_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: IDOEFRAIM/ladinifront
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: _frontend

      - name: Run tests
        env:
          SANDBOX_MODE: "true"
          MOCK_EXTERNAL_APIS: "true"
          SCHEMA_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          REQUIRE_SCHEMA_DB: "1"
          LADINI_FRONTEND_DIR: ${{ github.workspace }}/_frontend
        run: poetry run pytest tests --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        # Une panne réseau/TLS de Codecov lève une exception AVANT `fail_ci_if_error` : l'upload ne doit jamais rougir la CI.
        continue-on-error: true
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

      - name: Audit des dépendances (pip-audit)
        run: |
          pipx install pip-audit
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt || \
            poetry run pip freeze > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt
        continue-on-error: true

  # Tests de régression bash, SANS Poetry/dépendances backend (2026-09-18,
  # incident premier déploiement Hetzner — voir l'en-tête de
  # scripts/predeploy_check.sh) : ces scripts tournent SUR LE NODE DE PROD,
  # qui n'a jamais ces dépendances. Job séparé, volontairement léger (pas de
  # `runs-on`/setup Python) — sa conclusion fait partie de celle du workflow
  # "CI" dans son ensemble, donc gate `release.yml` (`workflow_run` +
  # `conclusion == 'success'`) exactement comme `test`/`migration-safety`,
  # sans avoir besoin d'un `needs` explicite vers `docker-build`.
  shell-tests:
    name: Tests bash (ufw.sh, predeploy_check.sh, verrous deploy, smoke Celery — sans dépendances backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: infra/firewall/ufw.sh — Cas A/B/C/D
        run: bash scripts/test/test-ufw-firewall.sh
      - name: predeploy_check.sh — fonctionne sur un host sans dépendances backend
        run: bash scripts/test/test-predeploy-check-minimal-host.sh
      - name: Verrous deploy — cluster/node, deadlock, stale lock, Redis (Cas A-F)
        run: bash scripts/test/test-deploy-lock-architecture.sh
      - name: Verrou node vs preflight — auto-deadlock sur soi-même (Cas G)
        run: bash scripts/test/test-node-preflight-lock.sh
      - name: Smoke Celery — celery_worker_ping (Cas A-F)
        run: bash scripts/test/test-celery-smoke.sh
      - name: Healthcheck worker Celery — crash-loop TLS (Cas G)
        run: bash scripts/test/test-celery-healthcheck.sh
      - name: cluster_deploy.sh — validation LB/chemin public, HEALTH_TIMEOUT (incident 2026-09-19)
        run: bash scripts/test/test-cluster-deploy-lb-validation.sh
      - name: preflight.sh — REDIS_URL schéma + placeholder embarqué (migration Upstash → Valkey, 2026-09-20)
        run: bash scripts/test/test-preflight-redis-url-checks.sh
      - name: preflight.sh — REDIS_URL parsable par urllib (incident réel sha-efc4ff8, 2026-09-20)
        run: bash scripts/test/test-preflight-redis-url-parseable.sh
      - name: preflight.sh — host:port joignable + gate WireGuard (tunnel Hetzner ↔ AWS, 2026-09-20)
        run: bash scripts/test/test-preflight-network-checks.sh
      - name: bind Valkey WireGuard + détection unit systemd (blockers #4/#5, 2026-09-20)
        run: bash scripts/test/test-valkey-bind-wireguard-order.sh
      - name: calcul maxmemory Valkey depuis la RAM réelle (blocker #3, 2026-09-20)
        run: bash scripts/test/test-compute-valkey-maxmemory.sh
      - name: application .env sur le node (backup + upsert + redaction, blocker #2, 2026-09-20)
        run: bash scripts/test/test-apply-env-change-on-node.sh

  # Garde EXPAND/CONTRACT (§11) — bloque une migration destructive dans la
  # MÊME release que le code qui en dépend encore. Voir le script pour la
  # liste des motifs interdits et comment marquer une contraction validée.
  migration-safety:
    name: Migration safety (expand/contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les migrations de cette PR
        # `bash …` plutôt que `./…` : robuste même si un checkout perd le bit +x
        # (le bit est bien positionné dans git, ceinture + bretelles).
        run: bash scripts/check_migrations.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}" HEAD

  # Valide que les 3 images se CONSTRUISENT encore + que le compose prod est
  # cohérent. Ne pousse rien.
  #
  # `needs` (2026-09-17, follow-up pre-Hetzner) — AJOUTÉ : ce job n'avait
  # aucune dépendance déclarée, il tournait donc EN PARALLÈLE de `test`/
  # `migration-safety` plutôt qu'après leur succès. Coûteux (un build inutile
  # si les tests échouent de toute façon) mais surtout trompeur : un
  # `docker-build` vert n'a jamais garanti que `test` l'était aussi. Release
  # (release.yml) est désormais également gatée sur ce workflow dans son
  # ensemble via `workflow_run` — voir son propre commentaire.
  docker-build:
    name: Validation des images Docker + compose
    needs: [test, migration-safety]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ci-${{ github.sha }}
      REGISTRY: local
      IMAGE_NAMESPACE: ladini
    steps:
      - uses: actions/checkout@v4

      # `docker build` PLAT (pas `docker/build-push-action` + buildx) —
      # DÉLIBÉRÉ. `docker/setup-buildx-action` installe un builder
      # `docker-container` dont le store d'images est ISOLÉ du démon Docker :
      # même avec `load: true` sur l'image api, le build worker/mcp qui suit
      # (`FROM local/ladini/ladini-api:…`) ne la retrouvait PAS et tentait de
      # la PULL depuis Docker Hub → "pull access denied" (échec CI constaté
      # 2026-09-11). Le builder par défaut des runners GitHub (`docker`
      # driver, BuildKit natif ≥ Docker 23) partage le store du démon : une
      # image construite est immédiatement visible comme base d'un build
      # suivant. `# syntax=` et `--mount=type=cache` restent supportés.
      - name: Build image api
        run: |
          docker build -f infra/docker/Dockerfile.api \
            --build-arg RELEASE_VERSION="${RELEASE_VERSION}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t "local/${IMAGE_NAMESPACE}/ladini-api:${RELEASE_VERSION}" .

      - name: Build image worker
        run: |
          docker build -f infra/docker/Dockerfile.worker \
            --build-arg API_IMAGE="local/${IMAGE_NAMESPACE}/ladini-api:${RELEASE_VERSION}" \
            -t "local/${IMAGE_NAMESPACE}/ladini-worker:${RELEASE_VERSION}" .

      - name: Build image mcp
        run: |
          docker build -f infra/docker/Dockerfile.mcp \
            --build-arg API_IMAGE="local/${IMAGE_NAMESPACE}/ladini-api:${RELEASE_VERSION}" \
            -t "local/${IMAGE_NAMESPACE}/ladini-mcp:${RELEASE_VERSION}" .

      - name: Valider docker-compose.prod.yml (config résolue)
        run: |
          cp .env.example .env
          # RELEASE_VERSION vient de l'env du job. Le compose PROD ne doit PAS
          # contenir de clé `build:` (build-once) — on l'assert.
          docker compose -f docker-compose.prod.yml config --quiet
          if docker compose -f docker-compose.prod.yml config | grep -qE '^\s+build:'; then
            echo "::error::docker-compose.prod.yml contient une directive build: — interdit (build-once)."
            exit 1
          fi
          # L'overlay de build doit rester valide lui aussi.
          docker compose -f docker-compose.prod.yml -f docker-compose.build.yml config --quiet
          rm -f .env
