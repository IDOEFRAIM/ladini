# ═════════════════════════════════════════════════════════════════════
# release.yml — BUILD ONCE. Sur push `main` (après merge d'une PR verte),
# construit les 3 images UNE FOIS, les tague par SHA de commit (immuable),
# les pousse sur GHCR, et publie un manifeste de release.
#
# La production ne construit JAMAIS d'image. Elle `pull` ces artefacts.
# Registry provider-neutral : GHCR par défaut, surchargeable par les vars
# repo `REGISTRY` / `IMAGE_NAMESPACE` (ECR, Docker Hub… sans toucher au YAML).
# ═════════════════════════════════════════════════════════════════════
name: Release (build & push images)

# (2026-09-17, follow-up pre-Hetzner) — GATE CORRIGÉ ICI : ce workflow se
# déclenchait auparavant sur `push: branches: [main]`, EN PARALLÈLE de
# `cicd.yml` (lui aussi déclenché sur `push`) — deux workflows indépendants
# sur le MÊME évènement, sans aucune dépendance entre eux. Le commentaire
# "après merge d'une PR verte" ci-dessous n'était qu'une INTENTION, jamais
# appliquée par ce fichier : `cicd.yml` pouvait échouer (tests rouges) tout
# en laissant CE workflow construire et pousser des images sur GHCR sans
# broncher — repose entièrement sur une protection de branche externe, non
# vérifiable/garantie depuis ce seul YAML. `workflow_run` fait de CE
# workflow une SUITE explicite de "CI" (cicd.yml) — il ne démarre qu'une
# fois CI terminé, et le premier job vérifie sa conclusion avant de
# construire quoi que ce soit.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/branche à builder (défaut : le ref courant)"
        required: false

concurrency:
  # Un seul build de release à la fois ; les suivants attendent (pas d'annulation
  # — on veut que chaque commit de main produise bien son image).
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'idoefraim/ladini' }}

jobs:
  build-push:
    name: Build & push (sha-${{ github.event.workflow_run.head_sha || github.sha }})
    runs-on: ubuntu-latest
    # `workflow_dispatch` (déclenchement manuel) n'a pas de `workflow_run` —
    # ce garde ne s'applique donc QUE quand le déclencheur est bien "CI" ;
    # un `conclusion` != 'success' (échec, annulation) arrête tout ici,
    # AVANT le moindre `docker build`/push.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write        # push GHCR
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      built_at: ${{ steps.meta.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `workflow_run` s'exécute dans le contexte du DÉFAUT du dépôt —
          # `head_sha` pointe explicitement le commit que "CI" vient de
          # valider (jamais un `github.sha` ambigu dans ce contexte).
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Compute release metadata
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "release_version=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse HEAD)"     >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. API — image de base. `latest` est poussé UNIQUEMENT comme alias de
      #    confort humain ; la prod se verrouille toujours sur le tag `sha-*`.
      - name: Build & push ladini-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-api:${{ steps.meta.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-api:latest
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.release_version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 2. worker + mcp : `FROM ${API_IMAGE}` → on leur passe l'image api
      #    tout juste poussée (pas de recompilation des deps).
      - name: Build & push ladini-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-worker:${{ steps.meta.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-worker:latest
          build-args: |
            API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-api:${{ steps.meta.outputs.release_version }}
          cache-from: type=gha
          provenance: false

      - name: Build & push ladini-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.mcp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-mcp:${{ steps.meta.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-mcp:latest
          build-args: |
            API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ladini-api:${{ steps.meta.outputs.release_version }}
          cache-from: type=gha
          provenance: false

      # Manifeste de release — artefact téléchargeable + résumé du job. Permet
      # de connaître "quelle release / quel SHA / quelle date" sans fouiller.
      - name: Publish release manifest
        run: |
          mkdir -p out
          cat > out/release.env <<EOF
          RELEASE_VERSION=${{ steps.meta.outputs.release_version }}
          GIT_SHA=${{ steps.meta.outputs.git_sha }}
          BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
          EOF
          cp out/release.env "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          {
            echo "## Release \`${{ steps.meta.outputs.release_version }}\`"
            echo '```'
            cat out/release.env
            echo '```'
            echo "Déployer :  \`./scripts/deploy.sh ${{ steps.meta.outputs.release_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: out/release.env
          retention-days: 90
